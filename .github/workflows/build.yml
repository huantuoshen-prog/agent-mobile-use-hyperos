name: build-ksu-module

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install platform + build-tools
        run: |
          sdkmanager --install "platforms;android-28" "build-tools;34.0.0"
          yes | sdkmanager --licenses >/dev/null || true

      - name: Build hook APK
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
        run: bash agent-hook-apk/build-ci.sh

      - name: Pack KernelSU module
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq zip
          bash ksu-module/pack.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: agent-mobile-use-ksu
          path: |
            release/*.zip
            agent-hook-apk/build/agent_hook.apk
          retention-days: 30
