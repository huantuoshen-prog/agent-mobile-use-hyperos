name: build-ksu-module

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.12'
          cache: false

      - name: Check gateway and bridge
        run: |
          python3 tools/sync-version.py
          git diff --exit-code -- agent-hook-apk/AndroidManifest.xml agent-hook-apk/src/com/agent/mobileuse/ReleaseInfo.java ksu-module/module.prop dsha-plugin/package.json dsha-plugin/lib/version.cjs vd-server-go/version.go
          node --test dsha-plugin/test/*.test.*
          cd vd-server-go && go test ./...

      - name: Package portable MCP client
        run: python3 tools/package-remote.py

      # ubuntu-latest already ships an Android SDK at $ANDROID_HOME. Do not use
      # android-actions/setup-android here: it runs `sdkmanager tools`, which no
      # longer exists in current cmdline-tools and fails with exit code 1.
      - name: Install platform android-28 + build-tools 34
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "SDK=$SDK"
          ls "$SDK/platforms" "$SDK/build-tools" 2>/dev/null || true
          export PATH="$SDK/cmdline-tools/latest/bin:$SDK/tools/bin:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platforms;android-28" "build-tools;34.0.0"
          ls "$SDK/platforms/android-28/android.jar"
          ls "$SDK/build-tools/34.0.0/aapt" "$SDK/build-tools/34.0.0/d8"

      - name: Compile hook APK without a signing key
        env:
          BUILD_UNSIGNED: '1'
        run: bash agent-hook-apk/build-ci.sh

      - name: Test island payloads and permission scopes
        run: |
          curl -fLsS --retry 3 https://repo.maven.apache.org/maven2/org/json/json/20231013/json-20231013.jar -o "$RUNNER_TEMP/json.jar"
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          CP="agent-hook-apk/build-ci/classes:agent-hook-apk/build-ci/stubs_classes:$RUNNER_TEMP/json.jar:$SDK/platforms/android-28/android.jar"
          mkdir -p agent-hook-apk/build-ci/tests
          javac -encoding UTF-8 -cp "$CP" -d agent-hook-apk/build-ci/tests agent-hook-apk/test/*.java
          java -cp "agent-hook-apk/build-ci/tests:$CP" com.agent.mobileuse.IslandPayloadSelftest
          java -cp "agent-hook-apk/build-ci/tests:$CP" com.agent.mobileuse.AgentLiveSelftest
          java -cp "agent-hook-apk/build-ci/tests:$CP" com.agent.mobileuse.QuestionPayloadSelftest
          java -cp "agent-hook-apk/build-ci/tests:$CP" com.agent.mobileuse.ReleaseFileSelftest

      - name: Build runtime binaries from source
        run: bash tools/build-runtime-ci.sh

      - name: Upload compilation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-verification-build
          path: |
            agent-hook-apk/build/agent_hook-unsigned.apk
            vd-tool-java/bin/*.dex
            vd-server-go/vd_server
            release/agent-mobile-use-remote-*.zip
          retention-days: 14

      - name: Sign with persistent key when configured
        id: signing
        if: github.event_name != 'pull_request'
        env:
          MODULE_KEYSTORE_BASE64: ${{ secrets.MODULE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.MODULE_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$MODULE_KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo 'Signing secrets not configured; release assets are built separately.'
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          KEYSTORE="$RUNNER_TEMP/module-release.keystore"
          trap 'rm -f "$KEYSTORE"' EXIT
          printf '%s' "$MODULE_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          "$SDK/build-tools/34.0.0/apksigner" sign --ks "$KEYSTORE" --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEYSTORE_PASSWORD --out agent-hook-apk/build/agent_hook.apk agent-hook-apk/build/agent_hook-unsigned.apk
          CERT=$("$SDK/build-tools/34.0.0/apksigner" verify --print-certs agent-hook-apk/build/agent_hook.apk | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          test "$CERT" = "$(tr -d '\r\n' < release-certificate.sha256)"
          echo 'configured=true' >> "$GITHUB_OUTPUT"

      - name: Pack signed module
        if: steps.signing.outputs.configured == 'true'
        run: bash ksu-module/pack.sh

      - name: Package paired plugin and verify release assets
        if: steps.signing.outputs.configured == 'true'
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          python3 tools/package-release.py --java "$JAVA_HOME/bin/java" --apksigner "$SDK/build-tools/34.0.0/lib/apksigner.jar" --apk agent-hook-apk/build/agent_hook.apk --staging-dir agent-hook-apk/build-ci/release-index

      - name: Upload signed artifacts
        if: steps.signing.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: signed-ksu-module
          path: |
            release/agent-mobile-use-ksu-v*.zip
            release/dsh-mobile-use-*.zip
            release/agent-mobile-use-remote-*.zip
            release/live-agent-*-manifest.json
            release/SHA256SUMS-*.txt
            agent-hook-apk/build-ci/release-index/alpha.json
            agent-hook-apk/build/agent_hook.apk
          retention-days: 30
