name: build-ksu-module

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest already ships an Android SDK at $ANDROID_HOME. Do not use
      # android-actions/setup-android here: it runs `sdkmanager tools`, which no
      # longer exists in current cmdline-tools and fails with exit code 1.
      - name: Install platform android-28 + build-tools 34
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "SDK=$SDK"
          ls "$SDK/platforms" "$SDK/build-tools" 2>/dev/null || true
          export PATH="$SDK/cmdline-tools/latest/bin:$SDK/tools/bin:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platforms;android-28" "build-tools;34.0.0"
          ls "$SDK/platforms/android-28/android.jar"
          ls "$SDK/build-tools/34.0.0/aapt" "$SDK/build-tools/34.0.0/d8"

      - name: Build hook APK
        run: bash agent-hook-apk/build-ci.sh

      - name: Pack KernelSU module
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq zip
          bash ksu-module/pack.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: agent-mobile-use-ksu
          path: |
            release/*.zip
            agent-hook-apk/build/agent_hook.apk
          retention-days: 30
